services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusbite_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusbite_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend